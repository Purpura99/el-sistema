<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome The System</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:#00d2ff;
    font-family:Segoe UI;
}

.portal{
    position:absolute;
    inset:0;
    background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.85)),
    url('portal.jpg') center/cover;
    animation:zoom 8s infinite alternate;
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

.content{
    position:relative;
    z-index:2;
    text-align:center;
}

.title{
    font-size:3rem;
    margin-bottom:20px;
    text-shadow:0 0 25px rgba(0,210,255,.8);
    animation:glow 1.5s infinite alternate;
}

@keyframes glow{
    from{opacity:.7;}
    to{opacity:1;}
}

.player{
    font-size:1.4rem;
    margin-bottom:35px;
    color:white;
}

.enter-btn{
    padding:16px 35px;
    border:none;
    border-radius:8px;
    background:#00d2ff;
    color:black;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
}

</style>
</head>
<body>

<div class="portal"></div>

<div class="content">

<div class="title">
WELCOME TO THE SYSTEM
</div>

<div class="player" id="playerName">
PLAYER
</div>

<button class="enter-btn" onclick="enterSystem()">
ENTRAR
</button>

</div>

<script>

const portalSound = new Audio('efec_portal.wav');

portalSound.volume = 0.7;

window.addEventListener('load', () => {

    portalSound.play();

});

const hunter = localStorage.getItem('hunter_name') || 'PLAYER';

document.getElementById('playerName').innerText = hunter;

function enterSystem(){

    window.location.href='index.html';
}

</script>

</body>
</html>
