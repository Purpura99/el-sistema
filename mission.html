<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión Diaria</title>

<style>

:root {
    --bg-color: #0a0c10;
    --panel-color: #121620;
    --neon-blue: #00d2ff;
    --text-color: #ffffff;
    --xp-color: #00ff88;
    --penalty-color: #ff2a2a;
}

body {
    margin: 0;
    font-family: Segoe UI;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.system-panel {
    background-color: var(--panel-color);
    border: 2px solid var(--neon-blue);
    padding: 30px;
    border-radius: 8px;
    width: 90%;
    max-width: 450px;
    text-align: center;
    box-shadow:0 0 20px rgba(0,210,255,.2);
}

.player-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.level-badge {
    font-size: 1.5rem;
    color: var(--neon-blue);
}

.xp-bar-bg {
    background:#222;
    height:12px;
    border-radius:10px;
    overflow:hidden;
}

.xp-bar-fill {
    background:var(--xp-color);
    height:100%;
    width:0%;
}

.timer-container {
    margin:20px 0;
    font-size:1.4rem;
    color:#ff9900;
}

.exercise-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.exercise-item button{
    background:transparent;
    border:1px solid var(--neon-blue);
    color:var(--neon-blue);
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
}

.exercise-item.completed{
    opacity:.5;
    text-decoration:line-through;
}

.reset-btn,
.back-btn{
    margin-top:20px;
    padding:10px 14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.back-btn{
    background:#00d2ff;
}

.reset-btn{
    background:#222;
    color:white;
}

</style>
</head>
<body>

<div class="system-panel">

<div class="player-status">

<div class="level-badge" id="player-level">
LVL. 1
</div>

<div style="width:60%;text-align:right;">
EXP: <span id="xp-text">0/100</span>

<div class="xp-bar-bg">
<div class="xp-bar-fill" id="xp-bar"></div>
</div>
</div>

</div>

<h1>[ MISIÓN DIARIA ]</h1>

<div id="quest-warning">
Completa la misión antes de la medianoche.
</div>

<div class="timer-container">
<span id="time-left">00:00:00</span>
</div>

<div class="exercise-item" id="pushups">
<span>Lagartijas <b class="count">0/100</b></span>
<button onclick="addProgress('pushups',10)">+10</button>
</div>

<div class="exercise-item" id="situps">
<span>Abdominales <b class="count">0/100</b></span>
<button onclick="addProgress('situps',10)">+10</button>
</div>

<div class="exercise-item" id="squats">
<span>Sentadillas <b class="count">0/100</b></span>
<button onclick="addProgress('squats',10)">+10</button>
</div>

<div class="exercise-item" id="run">
<span>Correr <b class="count">0/10 KM</b></span>
<button onclick="addProgress('run',1)">+1 KM</button>
</div>

<div style="margin-top:25px;" id="quest-status">
Estado: En progreso
</div>

<button class="reset-btn" onclick="forceResetDaily()">
Reiniciar misión
</button>

<br>

<button class="back-btn" onclick="goHome()">
Volver al Sistema
</button>

</div>

<script>

const dingSound = new Audio('ding.wav');
const levelupSound = new Audio('levelup.wav');

const limits = {
    pushups:100,
    situps:100,
    squats:100,
    run:10
};

let pData = JSON.parse(localStorage.getItem('sl_player')) || {
    level:1,
    xp:0,
    nextLevelXp:100
};

let qData = JSON.parse(localStorage.getItem('sl_quest')) || {
    date:new Date().toDateString(),
    completed:false,
    penaltyActive:false,
    pushups:0,
    situps:0,
    squats:0,
    run:0
};

function save(){
    localStorage.setItem('sl_player',JSON.stringify(pData));
    localStorage.setItem('sl_quest',JSON.stringify(qData));
}

function runTimer(){

    const now = new Date();

    const midnight = new Date();

    midnight.setHours(24,0,0,0);

    const diff = midnight - now;

    const hrs = String(Math.floor(diff / 1000 / 60 / 60)).padStart(2,'0');

    const mins = String(Math.floor((diff / 1000 / 60)%60)).padStart(2,'0');

    const secs = String(Math.floor((diff / 1000)%60)).padStart(2,'0');

    document.getElementById('time-left').innerText = `${hrs}:${mins}:${secs}`;
}

function addProgress(type,amount){

    if(qData.completed) return;

    qData[type]+=amount;

    if(qData[type]>limits[type]){
        qData[type]=limits[type];
    }

    pData.xp += amount*2;

    dingSound.currentTime = 0;
    dingSound.play();

    if(pData.xp >= pData.nextLevelXp){

        pData.level++;

        pData.xp = pData.xp - pData.nextLevelXp;

        pData.nextLevelXp += 50;

        levelupSound.play();
    }

    checkMission();

    save();

    renderUI();
}

function checkMission(){

    const completed = Object.keys(limits).every(key=>{
        return qData[key] >= limits[key];
    });

    if(completed){
        qData.completed = true;
    }
}

function forceResetDaily(){

    qData = {
        date:new Date().toDateString(),
        completed:false,
        penaltyActive:false,
        pushups:0,
        situps:0,
        squats:0,
        run:0
    };

    save();

    renderUI();
}

function renderUI(){

    document.getElementById('player-level').innerText = `LVL. ${pData.level}`;

    document.getElementById('xp-text').innerText = `${pData.xp}/${pData.nextLevelXp}`;

    document.getElementById('xp-bar').style.width = `${(pData.xp/pData.nextLevelXp)*100}%`;

    Object.keys(limits).forEach(key=>{

        const row = document.getElementById(key);

        const suffix = key === 'run' ? ' KM' : '';

        row.querySelector('.count').innerText = `${qData[key]}/${limits[key]}${suffix}`;

        if(qData[key] >= limits[key]){
            row.classList.add('completed');
        }else{
            row.classList.remove('completed');
        }
    });

    if(qData.completed){

        document.getElementById('quest-warning').innerText = 'MISIÓN COMPLETADA';

        document.getElementById('quest-status').innerText = 'Has sobrevivido.';
    }
}

function goHome(){
    window.location.href='index.html';
}

renderUI();
runTimer();

setInterval(runTimer,1000);

</script>

</body>
</html>
